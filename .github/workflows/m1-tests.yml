name: M1 EarthDial Contract Tests

on:
  push:
    paths:
      - "m1_earthdial/**"
      - ".github/workflows/m1-tests.yml"
  pull_request:
    paths:
      - "m1_earthdial/**"
      - ".github/workflows/m1-tests.yml"

jobs:
  test-m1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight M1 dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r m1_earthdial/requirements.txt

      - name: Run M1 offline contract tests
        run: python -m unittest discover -s m1_earthdial/tests -p "test_*.py" -v
